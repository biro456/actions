name: Setup Node & PNPM
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        run_install: |
          args: [--frozen-lockfile]
